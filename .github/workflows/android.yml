name: Android CI
on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"
      - name: Test and build
        run: gradle :app:testSideloadDebugUnitTest :app:assembleSideloadDebug :app:assembleStoreDebug
      - name: Verify sideload manifest has no notification listener
        shell: bash
        run: |
          manifest="$(find app/build/intermediates -type f -path '*sideloadDebug*' -name AndroidManifest.xml | head -n 1)"
          test -n "$manifest"
          if grep -q 'BIND_NOTIFICATION_LISTENER_SERVICE\|NotificationListenerService' "$manifest"; then
            echo "The direct-download APK unexpectedly declares a notification listener."
            exit 1
          fi
      - name: Prepare release APK
        if: startsWith(github.ref, 'refs/tags/')
        run: cp app/build/outputs/apk/sideload/debug/app-sideload-debug.apk "app/build/outputs/apk/sideload/debug/SonicField-${GITHUB_REF_NAME}.apk"
      - uses: actions/upload-artifact@v4
        with:
          name: sonicfield-installable-apk
          path: app/build/outputs/apk/sideload/debug/app-sideload-debug.apk
      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: app/build/outputs/apk/sideload/debug/SonicField-${{ github.ref_name }}.apk
